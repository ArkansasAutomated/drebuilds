<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(212,160,18,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Window border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2A2A2A" stroke-width="2" rx="8"/>
  
  <!-- Title bar background -->
  <rect x="41" y="41" width="1118" height="40" fill="#1A1A1A" rx="7"/>
  
  <!-- Traffic lights -->
  <circle cx="72" cy="61" r="7" fill="#FF5F56"/>
  <circle cx="96" cy="61" r="7" fill="#FFBD2E"/>
  <circle cx="120" cy="61" r="7" fill="#27C93F"/>
  
  <!-- Terminal label -->
  <text x="600" y="67" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#555555" text-anchor="middle" letter-spacing="2">
    TERMINAL
  </text>
  
  <!-- Content area with scanlines -->
  <rect x="41" y="81" width="1118" height="508" fill="url(#scanlines)" rx="0"/>
  
  <!-- Logo text with glow -->
  <text x="80" y="200" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="72" font-weight="700" fill="#D4A012" filter="url(#glow)">
    &gt; DRE_BUILDS_
  </text>
  
  <!-- Tagline -->
  <text x="80" y="290" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="32" fill="#888888">
    // Architect of Agentic Workflows
  </text>
  
  <!-- Description line 1 -->
  <text x="80" y="400" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" fill="#666666">
    &gt; Scaling business logic with AI automation,
  </text>
  
  <!-- Description line 2 -->
  <text x="80" y="440" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" fill="#666666">
      custom software, and agentic engineering.
  </text>
  
  <!-- Blinking cursor simulation -->
  <rect x="80" y="480" width="16" height="28" fill="#D4A012" opacity="0.8"/>
  
  <!-- Handle with glow -->
  <text x="1100" y="550" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="22" fill="#D4A012" text-anchor="end" filter="url(#glow)">
    @DreBuilds
  </text>
  
  <!-- Corner accents -->
  <path d="M 60 100 L 60 120 L 80 120" fill="none" stroke="#D4A012" stroke-width="2" opacity="0.4"/>
  <path d="M 1140 100 L 1140 120 L 1120 120" fill="none" stroke="#D4A012" stroke-width="2" opacity="0.4"/>
  <path d="M 60 570 L 60 550 L 80 550" fill="none" stroke="#D4A012" stroke-width="2" opacity="0.4"/>
  <path d="M 1140 570 L 1140 550 L 1120 550" fill="none" stroke="#D4A012" stroke-width="2" opacity="0.4"/>
</svg>