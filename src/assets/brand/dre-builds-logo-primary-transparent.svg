<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Terminal Text - No Background -->
  <text x="10" y="55" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="700" fill="#D4A012" filter="url(#glow)">
    &gt; DRE_BUILDS_
  </text>
</svg>
