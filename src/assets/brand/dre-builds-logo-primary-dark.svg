<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B800"/>
      <stop offset="100%" style="stop-color:#D4A012"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="120" fill="#0D0D0D"/>
  
  <!-- Scan lines effect -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
    <rect width="4" height="2" fill="transparent"/>
    <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.15)"/>
  </pattern>
  <rect width="600" height="120" fill="url(#scanlines)"/>
  
  <!-- Terminal Text -->
  <text x="30" y="78" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="52" font-weight="700" fill="url(#amberGradient)" filter="url(#glow)">
    &gt; DRE_BUILDS_
  </text>
</svg>
